name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908
        with:
          tool: cargo-nextest@0.9.143

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo nextest
        run: cargo nextest run --workspace

  readiness:
    name: Release readiness (build, doc, deny, audit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f

      - name: Install cargo-deny
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908
        with:
          tool: cargo-deny@0.20.2

      - name: Install cargo-audit
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908
        with:
          tool: cargo-audit@0.22.2

      - name: cargo build (all features)
        run: cargo build --workspace --all-features

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: cargo deny
        run: cargo deny check

      - name: cargo audit
        run: cargo audit --db ~/.cargo/audit-db

  msrv:
    name: MSRV (1.88.0)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.88.0
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy

      - name: cargo check (MSRV)
        run: cargo check --workspace
